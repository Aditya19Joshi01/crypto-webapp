apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-backend
  labels:
    app: crypto-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crypto-backend
  template:
    metadata:
      labels:
        app: crypto-backend
    spec:
      containers:
        - name: backend
          image: aditya19joshi01/crypto-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crypto-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: crypto-secrets
                  key: REDIS_URL
            - name: LIVE_MODE
              value: "true"
            - name: FETCH_INTERVAL
              value: "30"
            - name: CACHE_RETENTION
              value: "300"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
