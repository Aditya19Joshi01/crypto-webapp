apiVersion: v1
kind: Secret
metadata:
  name: crypto-secrets
type: Opaque
stringData:
  # Plaintext values will be encoded by kubectl when applied.
  POSTGRES_USER: crypto
  POSTGRES_PASSWORD: crypto
  POSTGRES_DB: crypto_db
  # DATABASE_URL should be a full SQLAlchemy-style URL and must point to the cluster Postgres service
  # (note: use crypto-postgres as host inside the cluster)
  DATABASE_URL: postgresql+asyncpg://crypto:crypto@crypto-postgres:5432/cryptodb
  # REDIS_URL should point to the redis service inside the cluster
  REDIS_URL: redis://crypto-redis:6379/0
