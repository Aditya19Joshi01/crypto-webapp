apiVersion: v1
kind: Secret
metadata:
  name: crypto-secrets
type: Opaque
data:
  # Replace these example base64 values with your actual encoded secrets.
  # e.g. echo -n 'crypto' | base64
  POSTGRES_USER: crypto
  POSTGRES_PASSWORD: crypto
  POSTGRES_DB: crypto_db
  # DATABASE_URL should be a full SQLAlchemy-style URL e.g. postgresql://user:pass@crypto-postgres:5432/dbname
  DATABASE_URL: postgresql+asyncpg://crypto:crypto@localhost:5432/cryptodb
  # REDIS_URL e.g. redis://crypto-redis:6379/0
  REDIS_URL: redis://localhost:6379/0
